<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Espelhos JEAN</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f4f5f8;--sf:#ffffff;--sf2:#eceef3;--ln:#dde1e8;--tx:#151b2a;--mt:#667085;
  --ac:#b07d2b;--acs:#f3e7d2;--acx:#ffffff;--ink:#1d2a4a;
  --ok:#1f8a4c;--wn:#b7791f;--bd:#c2412d;--in:#2e62c9;
  --fd:"Outfit","Segoe UI",system-ui,sans-serif;--fb:"Inter",system-ui,-apple-system,sans-serif;--fm:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1320;--sf:#151c2c;--sf2:#1d2638;--ln:#283349;--tx:#eef1f7;--mt:#94a0b8;--ac:#e0b062;--acs:#2e2717;--acx:#1a1408;--ink:#c9d4ee;--ok:#5fd08e;--wn:#f0b84a;--bd:#ff8a76;--in:#86aaff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1320;--sf:#151c2c;--sf2:#1d2638;--ln:#283349;--tx:#eef1f7;--mt:#94a0b8;--ac:#e0b062;--acs:#2e2717;--acx:#1a1408;--ink:#c9d4ee;--ok:#5fd08e;--wn:#f0b84a;--bd:#ff8a76;--in:#86aaff;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 var(--fb);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mt{color:var(--mt)}.sm{font-size:12.5px}
h1{font:600 34px/1.1 var(--fd);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:600 17px/1.25 var(--fd);margin:0}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mt);font-weight:600}
.app{display:flex;min-height:100vh}
nav.rail{position:sticky;top:0;height:100vh;width:212px;flex:none;background:var(--sf);border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:2px;padding:18px 12px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 16px}
.brand .lg{width:36px;height:36px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 18px var(--fd)}
.brand b{font:600 17px var(--fd);display:block;line-height:1.1}.brand small{color:var(--mt);font-size:11.5px}
nav.rail a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--mt);text-decoration:none;font-weight:500}
nav.rail a:hover{background:var(--sf2);color:var(--tx)}
nav.rail a.on{background:var(--acs);color:var(--tx)}
nav.rail svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav.rail .sp{flex:1}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--mt)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
main{flex:1;min-width:0}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 90px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;min-width:0}
.g{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kv .k{font-size:11.5px;color:var(--mt);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kv .v{font:600 22px/1.15 var(--fd);margin-top:2px}
.big{font:600 46px/1 var(--fd);letter-spacing:-.02em;color:var(--ac)}
.btn{border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13.5px;display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--tx)}
.btn:hover{border-color:var(--ac)}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.btn.s{padding:5px 10px;font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:10px;padding:3px;gap:2px;background:var(--sf);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--mt);font-weight:500;font-size:13px}
.seg button.on{background:var(--acs);color:var(--tx);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:5px 11px;cursor:pointer;font-size:12.5px}
.chip:hover{border-color:var(--ac)}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--acx);font-weight:600}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:0 12px;height:44px;flex:1;min-width:220px}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;font-size:14.5px}
.fld{border:1px solid var(--ln);background:var(--sf);border-radius:9px;padding:7px 10px;min-width:0}
.ticker{overflow:hidden;white-space:nowrap;border:1px solid var(--ln);background:var(--sf);border-radius:12px}
.ticker .tk{display:inline-flex;gap:26px;padding:10px 0;animation:tk 90s linear infinite}
.ticker:hover .tk{animation-play-state:paused}
@keyframes tk{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker .tk{animation:none}}
.tk span{font-size:13px}.tk i{font-style:normal;color:var(--mt);font-family:var(--fm);font-size:12px;margin-right:6px}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.st-vendida{background:color-mix(in srgb,var(--bd) 16%,transparent);color:var(--bd)}
.st-reservada{background:color-mix(in srgb,var(--wn) 18%,transparent);color:var(--wn)}
.st-processo_final{background:color-mix(in srgb,var(--in) 16%,transparent);color:var(--in)}
.st-disponivel{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.st-suspensa,.st-novo{background:var(--sf2);color:var(--mt)}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;font-size:11.5px;color:var(--mt)}
.bars i{display:block;width:100%;background:var(--ac);border-radius:6px 6px 2px 2px;min-height:3px;opacity:.75}
.bars>div.hj i{opacity:1}
.bars b{color:var(--tx);font-family:var(--fm);font-weight:500}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--ln);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.clk{cursor:pointer}.clk:hover{background:var(--sf2)}
.cov{position:relative;border-radius:12px;overflow:hidden;display:flex;align-items:flex-end;color:#fff;font:700 28px var(--fd);padding:12px;letter-spacing:-.01em;background-size:cover!important;background-position:center!important;text-shadow:0 1px 8px #0009}
.cov small{position:absolute;top:10px;left:10px;font:600 11px var(--fb);background:#0009;padding:3px 8px;border-radius:99px;letter-spacing:0;text-shadow:none}
.mini{width:46px;height:46px;flex:none;border-radius:10px;display:grid;place-items:center;color:#fff;font:700 15px var(--fd);background-size:cover!important;background-position:center!important}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card:hover{border-color:var(--ac)}
.card .cov{height:150px;border-radius:0}
.card .b{padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.card .pr{font:600 19px var(--fd);margin-top:4px}
.prog{height:8px;border-radius:99px;background:var(--sf2);overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.lay{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}
@media(max-width:980px){.lay{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:12px}
@media(max-width:980px){.side{position:static}}
.side h3{font:600 14px var(--fd);margin:0 0 8px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--ln);vertical-align:middle}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mt);font-weight:600}
td.r,th.r{text-align:right}
.ox{overflow-x:auto}
.cmp{display:grid;grid-template-columns:repeat(var(--n,5),minmax(190px,1fr));gap:12px}
.cmp .panel{display:flex;flex-direction:column;gap:6px}
.cmp .panel.base{border-color:var(--ac)}
.empty{color:var(--mt);padding:16px 4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;z-index:60;font-size:13px}
dialog{background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:16px;width:min(620px,96vw);padding:0;max-height:92vh}
dialog::backdrop{background:#000a}
.fh{position:sticky;top:0;background:var(--sf);padding:16px 20px 10px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;gap:10px;align-items:flex-start;z-index:2}
.fb{padding:14px 20px;display:flex;flex-direction:column;gap:14px}
.ff{position:sticky;bottom:0;background:var(--sf);padding:12px 20px;border-top:1px solid var(--ln);display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.un{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;cursor:pointer}
.un:has(input:checked){border-color:var(--ac);background:var(--acs)}
.un input{width:18px;height:18px;accent-color:var(--ac)}
.uns{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto;padding-right:4px}
.gal{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.gal a{flex:none;display:block;border-radius:10px;overflow:hidden;border:1px solid var(--ln);background:var(--sf2)}
.gal img{display:block;height:120px;width:auto;max-width:220px;object-fit:cover}
.gal.pl img{background:#fff;object-fit:contain;width:160px}
.gal figcaption{font-size:11.5px;color:var(--mt);padding:4px 6px;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pre{white-space:pre-wrap;background:var(--sf2);border-radius:12px;padding:14px;font-size:13.5px;line-height:1.55}
@media(max-width:820px){
  .app{flex-direction:column}
  nav.rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;width:auto;flex-direction:row;border-right:0;border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;overflow-x:auto;gap:0}
  nav.rail .brand,nav.rail .sp,nav.rail .foot{display:none}
  nav.rail a{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 10px;flex:none}
  h1{font-size:28px}.big{font-size:38px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Seções"></nav>
  <main><div class="wrap" id="view"></div></main>
</div>
<dialog id="dlg"><div id="dbody"></div></dialog>
<script>
"use strict";
/* Os dados vêm de dados/espelho.enc.json, gravado pelo robô (robo/orulo.mjs) de hora em hora.
   O arquivo é cifrado: só abre com um serial válido (secret SERIAIS do repositório). */
var F={id:0,n:1,iid:2,inc:3,bai:4,zona:5,fase:6,ent:7,disp:8,res:9,proc:10,vend:11,tot:12,pp:13,pv:14,dorm:15,m2a:16,m2b:17,capa:18,desc:19,tab:20,tabEm:21,stt:22,lat:23,lng:24,ap:25,upd:26,end:27,cid:28,vaga:29,m2p:30,cat:31};
var FASE={lanc:"Lançamento",breve:"Breve lançamento",obras:"Em obras",pronto:"Pronto"},FORD={pronto:0,obras:1,lanc:2,breve:3};
var ZONA={centro:"Centro",sul:"Zona Sul",oeste:"Zona Oeste",leste:"Zona Leste",norte:"Zona Norte",gsp:"Grande SP"};
var DORM={S:"Studio","1":"1 dorm","2":"2 dorms","3":"3 dorms","4":"4 dorms",L:"Loja"};
var CAT={H1:"HIS 1",H2:"HIS 2",H:"HIS",P:"HMP",R:"R2V",N:"NR",F:"F"};
var ST={disponivel:"Disponível",reservada:"Reservada",processo_final:"Em processo",vendida:"Vendida",suspensa:"Venda suspensa",novo:"Nova no espelho"};
var FOTO_BASE="https://luizmiguel08.github.io/espelhos/";
var DAY=864e5;
var D={p:[],m:[],em:0,ok:false,byId:{},erros:[]},ST8="carregando",UI={f:{q:"",modo:"pp",min:"",max:"",dorm:[],zona:[],fase:[],inc:[],cat:[],vaga:"",ent:"",sort:"vend"},rank:"vend",cmp:{id:"",mot:"parecidos",modo:"pp",km:3},tq:"",mper:"7"};

function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function brl(v){return v==null||isNaN(v)?"—":"R$ "+Math.round(v).toLocaleString("pt-BR")}
function brlc(v){if(v==null||isNaN(v))return "—";if(v>=1e6)return "R$ "+(v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:v>=1e8?0:1})+" mi";if(v>=1e3)return "R$ "+Math.round(v/1e3)+" mil";return brl(v)}
function m2(v){return v==null?"—":v.toLocaleString("pt-BR",{maximumFractionDigits:2})+" m²"}
function pc(a,b){return b?Math.round(a/b*100):0}
function sod(t){var d=new Date(t||Date.now());d.setHours(0,0,0,0);return d.getTime()}
function hm(t){return new Date(t).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
function dm(t){return new Date(t).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})}
function quando(t){var d=Math.round((sod()-sod(t))/DAY);return d<=0?"hoje, "+hm(t):d===1?"ontem, "+hm(t):dm(t)+", "+hm(t)}
function entTxt(p){var f=p[F.fase],e=p[F.ent];if(f==="pronto")return "Pronto";if(!e)return FASE[f]||"—";var a=e.split("-");return new Date(+a[0],+a[1]-1,1).toLocaleDateString("pt-BR",{month:"short",year:"numeric"}).replace(".","")}
function hue(s){var h=0;s=String(s);for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function foto(p){var c=p[F.capa];if(!c)return "";return /^https?:/.test(c)?c:FOTO_BASE+String(c).replace(/^\//,"")}
function covBg(p){var h=hue(p[F.iid]||p[F.id]),g="linear-gradient(140deg,hsl("+h+" 38% 34%),hsl("+((h+38)%360)+" 46% 16%))",f=foto(p);return f?"background:linear-gradient(180deg,#0000 35%,#000b),url('"+f.replace(/'/g,"%27")+"') center/cover,"+g:"background:"+g}
function ini(n){return String(n).replace(/[^\p{L}\p{N} ]/gu,"").split(/\s+/).filter(function(w){return w.length>1||/\d/.test(w)}).slice(0,2).map(function(w){return w[0]}).join("").toUpperCase()}
function iniOuFoto(p){return foto(p)?"":esc(ini(p[F.n]))}
function toast(m){var t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2400)}
function copy(t){try{navigator.clipboard.writeText(t).then(function(){toast("Copiado")},function(){toast("Selecione e copie o texto")})}catch(e){toast("Selecione e copie o texto")}}
function P(id){return D.byId[id]}
function dist(a,b){if(a[F.lat]==null||b[F.lat]==null)return null;var R=6371,dl=(b[F.lat]-a[F.lat])*Math.PI/180,dg=(b[F.lng]-a[F.lng])*Math.PI/180,x=Math.sin(dl/2)**2+Math.cos(a[F.lat]*Math.PI/180)*Math.cos(b[F.lat]*Math.PI/180)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function perto(a,b){var d=dist(a,b);if(d!=null)return d;return a[F.bai]&&a[F.bai]===b[F.bai]?0.5:a[F.zona]&&a[F.zona]===b[F.zona]?4:null}
function preco(p,modo){var v=p[modo==="pv"?F.pv:F.pp];return v==null?p[F.pp]:v}
function dorms(p){return String(p[F.dorm]||"").split("").map(function(c){return DORM[c]||c})}
function vendas7(){var a={},t=Date.now()-7*DAY;D.m.forEach(function(x){if(x[4]*1000>=t&&x[3]==="vendida")a[x[0]]=(a[x[0]]||0)+1});return a}

var ICO={
 inicio:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
 imoveis:'<rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2M8 15h2M14 15h2"/>',
 pregao:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
 tabelas:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/>',
 comparar:'<rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/>',
 mercado:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 resumo:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/>',
 docs:'<path d="M4 4h6l2 2h8v14H4z"/>',
 enviadas:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>'
};
var NAV=[["inicio","Início"],["imoveis","Imóveis"],["pregao","Pregão"],["tabelas","Tabelas"],["comparar","Comparar"],["enviadas","Enviadas"],["docs","Documentos"],["mercado","Mercado"],["resumo","Resumo do dia"]];
var cur="inicio",R={},A={};
function rail(){
  var v=cur.indexOf("p-")===0?"tabelas":cur;
  $("#rail").innerHTML='<div class="brand"><div class="lg">J</div><div><b>Espelhos</b><small>JEAN Investimentos</small></div></div>'+NAV.map(function(n){return '<a href="#'+n[0]+'" class="'+(v===n[0]?"on":"")+'"><svg viewBox="0 0 24 24">'+ICO[n[0]]+'</svg>'+n[1]+'</a>'}).join("")+'<div class="sp"></div><div class="foot" style="padding:8px 10px;display:flex;flex-direction:column;gap:8px">'+(D.ok?'<span class="live">Atualizado '+quando(D.em)+'</span><span class="sm mt">O robô lê os portais de hora em hora</span>':'')+'<button class="btn s" data-a="tema">Tema claro/escuro</button><button class="btn s" data-a="sair">Sair</button></div>';
}
function go(){var h=(location.hash||"").slice(1);cur=h&&(R[h]||(h.indexOf("p-")===0&&P(h.slice(2))))?h:"inicio";render();window.scrollTo(0,0)}
function render(){var v=$("#view");if(!D.ok&&ST8==="login"){$("#rail").style.display="none";v.innerHTML=telaLogin(MSG);ligarLogin();return}$("#rail").style.display="";rail();if(!D.ok){v.innerHTML=vazio();return}var k=cur.indexOf("p-")===0?"projeto":cur,f=k==="projeto"?function(){return R.projeto(cur.slice(2))}:R[cur];v.innerHTML=f();if(A[k])A[k]()}
function render2(){var y=window.scrollY;render();window.scrollTo(0,y)}
function vazio(){
  if(ST8==="carregando")return '<div class="panel"><p class="mt">Carregando os espelhos…</p></div>';
  return '<div class="top"><div><div class="eyebrow">Espelhos JEAN</div><h1>Ainda não há dados</h1></div></div><div class="panel"><p>O robô ainda não terminou a primeira leitura dos portais. Volte em alguns minutos.</p></div>';
}

/* ---------- Início ---------- */
R.inicio=function(){
  var now=Date.now(),h=new Date().getHours(),sau=h<5?"Boa noite":h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";

function opcoes(b,mot,modo,km){
  var pb=preco(b,modo),ds=String(b[F.dorm]||"");
  var c=D.p.filter(function(p){return p!==b&&p[F.disp]>0&&preco(p,modo)}).map(function(p){return{p:p,d:perto(b,p),pr:preco(p,modo)}});
  var pt=function(x){return km===0||(x.d!=null&&x.d<=km)},dormOk=function(x){var d=String(x.p[F.dorm]||"");return !ds||ds.split("").some(function(ch){return d.indexOf(ch)>=0})};
  var r;

  else if(mot==="entrega")r=c.filter(function(x){return pt(x)&&dormOk(x)&&(FORD[x.p[F.fase]]<FORD[b[F.fase]]||(x.p[F.ent]&&b[F.ent]&&x.p[F.ent]<b[F.ent]))}).sort(function(a,b2){return (FORD[a.p[F.fase]]-FORD[b2.p[F.fase]])||String(a.p[F.ent]||"0").localeCompare(String(b2.p[F.ent]||"0"))});
  else if(mot==="regiao")r=c.filter(function(x){return x.p[F.zona]!==b[F.zona]&&dormOk(x)&&(!pb||Math.abs(x.pr-pb)/pb<=.2)}).sort(function(a,b2){return Math.abs(a.pr-pb)-Math.abs(b2.pr-pb)});
  else if(mot==="maior")r=c.filter(function(x){return pt(x)&&(x.p[F.m2b]||0)>(b[F.m2b]||0)&&(!pb||x.pr<=pb*1.25)}).sort(function(a,b2){return (b2.p[F.m2b]||0)-(a.p[F.m2b]||0)});
  else r=c.filter(function(x){return pt(x)&&dormOk(x)&&(!pb||Math.abs(x.pr-pb)/pb<=.25)}).sort(function(a,b2){return (pb?Math.abs(a.pr-pb)/pb:0)+(a.d||0)/10-((pb?Math.abs(b2.pr-pb)/pb:0)+(b2.d||0)/10)});

/* ---------- acesso por serial + dados cifrados ---------- */
// O robô publica dados/espelho.enc.json cifrado. Cada serial válido destranca a chave da rodada.
var SK="esp-jean-serial",ENC=new TextEncoder();
function unb64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function norm(s){return String(s||"").trim().toUpperCase()}
async function idDoSerial(s){var h=new Uint8Array(await crypto.subtle.digest("SHA-256",ENC.encode("espelhos-jean:"+norm(s))));return Array.from(h.slice(0,8)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
async function abrir(pac,serial){
  var id=await idDoSerial(serial),a=(pac.acessos||[]).filter(function(x){return x.id===id})[0];if(!a)return null;
  var base=await crypto.subtle.importKey("raw",ENC.encode(norm(serial)),"PBKDF2",false,["deriveKey"]);
  var ks=await crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(a.s),iterations:pac.it||210000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  var k=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(a.iv)},ks,unb64(a.w));
  var kd=await crypto.subtle.importKey("raw",k,"AES-GCM",false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(pac.iv)},kd,unb64(pac.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
