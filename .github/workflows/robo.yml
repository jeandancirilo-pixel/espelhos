name: Robô dos espelhos

on:
  schedule:
    - cron: "17 * * * *"   # de hora em hora (horário UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: robo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Ler os portais
        env:
          ORULO_USUARIO: ${{ secrets.ORULO_USUARIO }}
          ORULO_SENHA: ${{ secrets.ORULO_SENHA }}
        run: node robo/orulo.mjs
      - name: Guardar print de erro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
      - name: Salvar os dados
        run: |
          git config user.name "robo-espelhos"
          git config user.email "robo-espelhos@users.noreply.github.com"
          git add docs/dados
          git diff --cached --quiet || (git commit -m "Espelhos atualizados $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')" && git push)
